name: presensi_liveness
description: "Sistem Presensi Mahasiswa - Liveness Detection & Geofencing"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase (foto disimpan Base64 di Firestore, bukan Firebase Storage -
  # lihat core/utils/image_compression.dart)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0

  # State management
  provider: ^6.1.2

  # Liveness pipeline: camera stream -> face detection -> tflite inference
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.3.0

  # Geofencing
  geolocator: ^13.0.2

  # Attachments (bukti izin/sakit) & date formatting
  image_picker: ^1.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
