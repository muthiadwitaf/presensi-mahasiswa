name: presensi_liveness
description: "Sistem Presensi Mahasiswa - Liveness Detection & Geofencing"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.8.0

  provider: ^6.1.2

  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.11.0
  image: ^4.3.0

  geolocator: ^13.0.2
  geocoding: ^5.0.0

  image_picker: ^1.1.2
  intl: ^0.19.0
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
